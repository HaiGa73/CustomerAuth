spring.application.name=shop-jwt-nimbus
server.port=8081

# Driver & URL kết nối SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Lưu ý: trustServerCertificate=true bắt buộc phải có trên SQL Server 2022 để tránh lỗi SSL/TLS
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=shop_jwt_db;encrypt=true;trustServerCertificate=true;

spring.datasource.username=sa
spring.datasource.password=123456

# Cấu hình Hibernate cho SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cấu hình JWT
app.jwt.secret=9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
app.jwt.expiration-ms=7200000